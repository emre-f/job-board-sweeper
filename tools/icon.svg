  <!-- band across the head -->
  <line x1="42" y1="60" x2="86" y2="60" stroke="#111827" stroke-width="11" stroke-linecap="round"/>
  <!-- interior bristle strokes -->
  <line x1="55" y1="80" x2="53" y2="92" stroke="#111827" stroke-width="10" stroke-linecap="round"/>
  <line x1="73" y1="80" x2="75" y2="92" stroke="#111827" stroke-width="10" stroke-linecap="round"/>
